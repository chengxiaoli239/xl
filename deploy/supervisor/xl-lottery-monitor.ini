[program:xl_queue_monitor]
command=/www/wwwroot/lt/lottery_xl/current/php74-yii yii queue-monitor/listen 1 --interactive=0 --php-binary=/www/wwwroot/lt/lottery_xl/current/php74-yii
directory=/www/wwwroot/lt/lottery_xl/current
user=ec2-user
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=false
stdout_logfile=/www/server/supervisor/logs/xl_queue_monitor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/www/server/supervisor/logs/xl_queue_monitor.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
environment=HOME="/home/ec2-user",USER="ec2-user"

[program:xl_queue_monitor_scheduler]
command=/www/wwwroot/lt/lottery_xl/current/php74-yii number-monitor/schedule 3 --interactive=0
directory=/www/wwwroot/lt/lottery_xl/current
user=ec2-user
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=false
stdout_logfile=/www/server/supervisor/logs/xl_queue_monitor_scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/www/server/supervisor/logs/xl_queue_monitor_scheduler.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
environment=HOME="/home/ec2-user",USER="ec2-user"
