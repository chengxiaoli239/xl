[program:xl_queue]
command=/www/wwwroot/lt/lottery_xl/xl/php84-yii yii queue/listen 3 --interactive=0 --php-binary=/www/wwwroot/lt/lottery_xl/xl/php84-yii
directory=/www/wwwroot/lt/lottery_xl/xl
user=ec2-user
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=false
stdout_logfile=/www/server/supervisor/logs/xl_queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/www/server/supervisor/logs/xl_queue.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
environment=HOME="/home/ec2-user",USER="ec2-user"

