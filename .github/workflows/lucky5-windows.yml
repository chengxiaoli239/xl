name: Build Lucky5 for Windows

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/lucky5-windows.yml'
      - 'client/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: client/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r client/requirements.txt
      - name: Test Chrome detection
        env:
          PYTHONPATH: client
        run: python -m unittest client.tests.test_chrome_path_detector client.tests.test_client_auth client.tests.test_bet_execution_timing
      - name: Build Windows executable
        run: python client/xy_client/build.py --clean --name Lucky5
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $path = 'client/dist/Lucky5.exe'
          $manifest = Get-Content 'client/dist/Lucky5-build.json' | ConvertFrom-Json
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'The build output is not a Windows PE executable.'
          }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.source_commit -ne $env:GITHUB_SHA -or
              $manifest.size -ne $bytes.Length -or $manifest.sha256 -ne $hash) {
            throw 'Windows package does not match its source manifest.'
          }
          Write-Host "Size: $($bytes.Length) bytes"
          Write-Host "SHA-256: $hash"
      - name: Verify folder package
        shell: pwsh
        run: |
          $manifest = Get-Content 'client/dist/Lucky5-package.json' | ConvertFrom-Json
          $zip = 'client/dist/Lucky5-Windows.zip'
          if ($manifest.platform -ne 'windows' -or $manifest.source_commit -ne $env:GITHUB_SHA -or
              $manifest.size -ne (Get-Item $zip).Length -or
              $manifest.sha256 -ne (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'Windows ZIP does not match its manifest.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            if (-not ($entries.Entries.FullName -contains 'Lucky5/Lucky5.exe')) {
              throw 'The ZIP must contain Lucky5/Lucky5.exe.'
            }
          } finally { $entries.Dispose() }
      - name: Smoke test extracted client
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $folder = Join-Path $env:RUNNER_TEMP 'lucky5-package-smoke'
          [System.IO.Compression.ZipFile]::ExtractToDirectory(
            (Resolve-Path 'client/dist/Lucky5-Windows.zip'), $folder)
          $exe = Join-Path $folder 'Lucky5/Lucky5.exe'
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new($exe)
          $startInfo.UseShellExecute = $false
          $startInfo.Environment['QT_QPA_PLATFORM'] = 'offscreen'
          $startInfo.Environment['LOCALAPPDATA'] = Join-Path $env:RUNNER_TEMP 'lucky5-empty-profile'
          $process = [System.Diagnostics.Process]::Start($startInfo)
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) {
              throw "Lucky5 exited during startup with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) { $process.Kill($true) }
            $process.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Lucky5-Windows-${{ github.sha }}
          path: |
            client/dist/Lucky5.exe
            client/dist/Lucky5-build.json
            client/dist/Lucky5-Windows.zip
            client/dist/Lucky5-package.json
          if-no-files-found: error
          retention-days: 7
