<link rel="stylesheet" href="/vendors/layui/2.5.4/css/layui.css?v=2020">
<link rel="stylesheet" href="/css/layui/global.css?v={{STATIC_VERSION}}">
<script type="text/javascript" src="/vendors/layui-layer/3.1.1/layer.js"></script>
<script type="text/javascript" src="/vendors/layui/2.4.5/layui.js"></script>
<script type="text/javascript" src="/vendors/atrtemplate/4.13.2/template-web.js"></script>
<script type="text/javascript" src="/statics/js/jquery-2.0.3.js"></script>
<script type="text/javascript" src="/js/layui/global.js?v={{STATIC_VERSION}}"></script>
<script type="text/javascript" src="/js/common.js?v={{STATIC_VERSION}}"></script>
<div style="float: left; width: 100%;"><div>
<div id="new-content" style="margin-top: 65px;margin-left: -8px">
    <div class="title" style="margin-bottom: 5px">
        <h3>消息队列列表&nbsp;&nbsp;</h3>
    </div>
    <div class="search-cond clearfix">
        <form class="layui-form  layuiadmin-card-header-auto" action="" data-auto-get id="search-form">
            <div class="row">
                <div class="col-md-1">
                    <input type="text" name="id" id="id" autocomplete="off" class="layui-input" placeholder="id">
                </div>
                <div class="col-md-2">
                    <input type="text" name="job_class" autocomplete="off" class="layui-input" placeholder="完整类名">
                </div>
                <div class="col-md-1">
                    <select class="layui-input" name="is_delay" lay-search>
                        <option value="">--是否延迟--</option>
                        <option value="2">否</option>
                        <option value="1">是</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <!--<input type="text" name="name" autocomplete="off" class="layui-input" placeholder="名称">-->
                    <select class="layui-input" name="name" lay-search>
                        <option value="">--选择名称--</option>
                        {%for item in options['name']%}
                            <option value="{{item.name}}">{{item.name}}[{{item.job_class}}]</option>
                        {%endfor%}
                    </select>
                </div>
                <div class="col-md-1">
                    <select class="layui-input" name="status" lay-search>
                        <option value="">--选择状态--</option>
                        <option value="1">待处理</option>
                        <option value="2">处理中</option>
                        <option value="3">成功</option>
                        <option value="4">异常</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="text" name="create_time" placeholder="时间" id="create_time" autocomplete="off" class="layui-input">
                </div>
                <div class="col-md-3">
                    <input type="text" name="params" autocomplete="off" class="layui-input" placeholder="参数内容">
                </div>
                <div class="col-md-3">
                    <input type="text" name="business_id" autocomplete="off" class="layui-input" placeholder="business_id">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="layui-btn layui-btn-sm" lay-submit="" lay-filter="LAY-user-front-search" id="search-submit">
                        <i class="layui-icon layui-icon-search"></i>
                        搜索
                    </button>
                    <button type="reset" class="layui-btn layui-btn-warm layui-btn-sm" lay-submit="" lay-filter="LAY-user-front-search">
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div class="clearfix"></div>
    <table class="layui-hide" lay-filter="main" id="main-table"></table>
    <script type="text/html" id="toolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm" lay-event="repush">批量重新入列</button>
            <button class="layui-btn layui-btn-sm" lay-event="mark-complete">批量标记完成</button>
        </div>
    </script>
    <script type="text/html" id="bar">
        <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="detail">查看系统状态</a>
    </script>
    <script type="text/javascript">

        function show()
        {
            let text = $(event.target).next('span').html();
            layui.layer.alert('<pre>' + text + '</pre>', {area: ['900px', '600px']});
        }

        layui.use(['form', 'layer', 'table', 'laydate', 'element'], function () {
            var $ = layui.$, form = layui.form, layer = layui.layer, laydate=layui.laydate,element = layui.element;

            laydate.render({
                elem: '#create_time',
                type: 'datetime',
                range: '~',
            });

            var table = layui.table;

            window.Tnmc.tableIns = table.render({
                id: 'main',
                totalRow: true,
                toolbar: '#toolbar',
                defaultToolbar: ['filter'],
                elem: '#main-table',
                cellMinWidth:'80',
                // skin: "line",
                url:'/forum/queue-log/get-list',
                cols: [
                    [
                        {checkbox: true},
                        {type:"numbers", title: '序号', width:60},
                        {field:"id", title: 'ID', width:180},
                        {field:"name", title: '名称', width:150},
                        {field:"type", title: '队列类型', width:80},
                        {field:"job_class", title: '类名', width:300},
                        {field:'status_text', title: '状态', width:80, templet: function (d) {
                                let result = d.status_text;
                                if (d.status == 2) {
                                    result = '<span style="color:#FEC548"><strong>'+ d.status_text + '</strong></span>';
                                } else if (d.status == 3) {
                                    result = '<span style="color:#3CA99E"><strong>'+ d.status_text + '</strong></span>';
                                } else if (d.status == 4) {
                                    result = '<span style="color:#FF7851"><strong>'+ d.status_text + '</strong></span>';
                                }

                                return result;
                            }},
                        {field:'count', title: '运行次数', width:80},
                        {field:'delay', title: '延迟秒数', width:60},
                        {field:'time', title: '运行时长(秒)', width:100},
                        {field:'params', title: '参数', width:250, templet: function (d) {
                                let params;
                                try  {
                                    params = JSON.parse(d.params);
                                    params = JSON.stringify(params, null, 4);
                                } catch(exception) {
                                    params = d.params;
                                }
                                return '<button class="layui-btn layui-btn-xs" onclick="show()">查看</button>' + '<span>' + params + '</span>';

                            }},
                        {field:'remark', title: '运行结果', width:150},
                        {field:'create_time', title: '入列与完成时间', width:180, templet: function (d) {
                                let result = '入列:' + d.last_push_time;
                                result += '</br>' + '完成:' + d.complete_time;
                                return result;
                            }},
                        {field:'create_time', title: '创建更新时间', width:180, templet: function (d) {
                                let result = '创建:' + d.create_time;
                                result += '</br>' + '更新:' + d.update_time;
                                return result;
                            }},
                        {field:'business_id', title: '业务id', width:100},
                        {title:'操作', toolbar: '#bar', width: 150}
                    ],

                ],
                done: function(res, curr, count){
                    if (res.code != 0) {
                        layer.msg(res.msg);
                    }
                },
                page: true,
                limit: 30,
                autoSort: true,
                height:window.Tnmc.getTableHeight() - 80,
                where: window.Tnmc.getUrlFormArgs()
            });

            table.on('tool(main)', function(obj){
                var data = obj.data;
                console.log(data);
                if(obj.event === 'detail'){
                    requestApi('/forum/queue-log/status', {system_queue_id:data.system_queue_id}, function(data) {
                        layer.alert(data.message);
                    }, 'no');
                }
            });

            //头工具栏事件
            table.on('toolbar(main)', function(obj){
                let queues = [];
                let checkStatus = table.checkStatus('main');
                let url = '';
                switch(obj.event){
                    case 'repush':
                        if (checkStatus.data.length == 0) {
                            layer.msg('请至少选中一行');
                            return;
                        }
                        for(let i in checkStatus.data) {
                            queues.push([checkStatus.data[i].id, checkStatus.data[i].job_class]);
                        }
                        console.log(queues);

                        url = '/forum/queue-log/re-push';
                        requestApi(url, {'queues':queues}, function(){
                            $('#search-submit').click();
                        });

                        break;
                    case 'mark-complete':
                        if (checkStatus.data.length == 0) {
                            layer.msg('请至少选中一行');
                            return;
                        }
                        let queuesIds = [];
                        for(let i in checkStatus.data) {
                            queuesIds.push(checkStatus.data[i].id);
                        }
                        console.log(queuesIds);

                        url = '/forum/queue-log/mark-complete';
                        requestApi(url, {'queue_ids':queuesIds}, function(){
                            $('#search-submit').click();
                        });
                        break;
                };
            });
        });
    </script>
</div>
