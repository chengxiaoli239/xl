<style type="text/css">
  .layui-form-label
  {
    width: 110px;
  }
  
</style>

<form class="layui-form" action="/index.php?r=/config/config/post-group-create" 
data-auto-submit 
data-reload="true" style="padding: 20px 0px;">
    <input type="hidden" name="id"  autocomplete="off" placeholder="" value="{{data.id}}" class="layui-input">
  <div class="layui-form-item">
    <label class="layui-form-label">分组名称</label>
    <div class="layui-input-inline" style="width: 300px;">
      <input type="text" name="name" autocomplete="off" placeholder="分组名称" value="{{data.name}}" class="layui-input">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">键名</label>
    <div class="layui-input-inline" style="width: 300px;">
      <input type="text" name="key"  placeholder="" value="{{data.key}}" autocomplete="off" class="layui-input">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">排序</label>
    <div class="layui-input-inline" style="width: 300px;">
      <input type="text" name="sort"  placeholder="" value="{{data.sort}}" autocomplete="off" class="layui-input">
    </div>
  </div>
 


 
  
 


 
</form>
